<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Схема Московского Метро</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #0b0f19; /* Темный футуристичный фон */
        }
        #info {
            position: absolute;
            top: 15px;
            left: 15px;
            font-family: Arial, sans-serif;
            color: #ffffff;
            pointer-events: none;
        }
        h2 { margin: 0 0 5px 0; color: #3498db; }
        p { margin: 0; font-size: 14px; color: #aaa; }
    </style>
</head>
<body>

    <div id="info">
        <h2>Московское Метро (3D)</h2>
        <p>Вращайте и приближайте сцену пальцем или мышкой</p>
    </div>

    <!-- Подключаем Three.js -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        let scene, camera, renderer, metroGroup;

        init();
        animate();

        function init() {
            // --- Сцена ---
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0b0f19); // Глубокий темный космос/фон

            // --- Камера ---
            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 15, 20); // Смотрим на метро сверху-сбоку

            // --- Рендерер ---
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            // --- Освещение ---
            const ambientLight = new THREE.AmbientLight(0xffffff, 1);
            scene.add(ambientLight);

            // --- Контейнер для метро ---
            metroGroup = new THREE.Group();
            scene.add(metroGroup);

            // Цвета линий метро
            const colors = {
                koltsevaya: 0x8e44ad, // Кольцевая (Коричневая/Фиолетовая)
                sokolnicheskaya: 0xe74c3c, // Красная
                zamoskvoretskaya: 0x2ecc71, // Зеленая
                arbatskaya: 0x3498db // Синяя
            };

            // 1. Создаем Кольцевую линию (эллипс / кольцо)
            const ringRadius = 4;
            const ringGeo = new THREE.TorusGeometry(ringRadius, 0.12, 16, 100);
            const ringMat = new THREE.MeshBasicMaterial({ color: colors.koltsevaya });
            const ring = new THREE.Mesh(ringGeo, ringMat);
            ring.rotation.x = Math.PI / 2;
            metroGroup.add(ring);

            // Функция для создания радиальных линий и станций
            function createLine(angle, length, color) {
                const points = [];
                const startX = Math.cos(angle) * 1.5;
                const startZ = Math.sin(angle) * 1.5;
                const endX = Math.cos(angle) * length;
                const endZ = Math.sin(angle) * length;

                points.push(new THREE.Vector3(startX, 0, startZ));
                points.push(new THREE.Vector3(endX, 0, endZ));

                const geometry = new THREE.BufferGeometry().setFromPoints(points);
                const material = new THREE.LineBasicMaterial({ color: color, linewidth: 3 });
                const line = new THREE.Line(geometry, material);
                metroGroup.add(line);

                // Добавляем станции (шарики на линии)
                for (let i = 1; i <= 3; i++) {
                    let t = i / 4;
                    let sx = startX + (endX - startX) * t;
                    let sz = startZ + (endZ - startZ) * t;
                    
                    const stationGeo = new THREE.SphereGeometry(0.18, 16, 16);
                    const stationMat = new THREE.MeshStandardMaterial({ 
                        color: 0xffffff, 
                        emissive: color, 
                        emissiveIntensity: 0.5 
                    });
                    const station = new THREE.Mesh(stationGeo, stationMat);
                    station.position.set(sx, 0, sz);
                    metroGroup.add(station);
                }
            }

            // Создаем радиальные направления под разными углами
            createLine(0, 7, colors.sokolnicheskaya);
            createLine(Math.PI / 2, 7, colors.zamoskvoretskaya);
            createLine(Math.PI, 7, colors.sokolnicheskaya);
            createLine(-Math.PI / 2, 7, colors.zamoskvoretskaya);
            
            createLine(Math.PI / 4, 6.5, colors.arbatskaya);
            createLine(-Math.PI / 4, 6.5, colors.arbatskaya);
            createLine(3 * Math.PI / 4, 6.5, colors.arbatskaya);
            createLine(-3 * Math.PI / 4, 6.5, colors.arbatskaya);

            // Управление вращением
            const controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.update();

            window.addEventListener('resize', onWindowResize);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);

            // Медленное вращение всей схемы для красоты
            metroGroup.rotation.y += 0.002;

            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
