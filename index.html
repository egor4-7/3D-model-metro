<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Студия - Тест</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #ffffff;
        }
        #info {
            position: absolute;
            top: 15px;
            left: 15px;
            font-family: Arial, sans-serif;
            color: #333;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="info">
        <h3>3D Студия</h3>
        <p>Поворачивайте сцену пальцем или мышкой</p>
    </div>

    <!-- Подключаем Three.js -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        let scene, camera, renderer, cube;

        init();
        animate();

        function init() {
            // Сцена и белый фон
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0xffffff);

            // Камера
            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
            camera.position.set(0, 2, 5);

            // Рендерер с тенями
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            document.body.appendChild(renderer.domElement);

            // Освещение
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 1);
            dirLight.position.set(3, 8, 4);
            dirLight.castShadow = true;
            scene.add(dirLight);

            // Белый пол (принимает тени)
            const floorGeo = new THREE.PlaneGeometry(10, 10);
            const floorMat = new THREE.ShadowMaterial({ opacity: 0.2 });
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.rotation.x = -Math.PI / 2;
            floor.receiveShadow = true;
            scene.add(floor);

            // Создаем красивый 3D-куб (вместо персонажа для теста)
            const geometry = new THREE.BoxGeometry(1, 1, 1);
            const material = new THREE.MeshStandardMaterial({ color: 0xe74c3c, roughness: 0.3 });
            cube = new THREE.Mesh(geometry, material);
            cube.position.y = 0.5;
            cube.castShadow = true;
            scene.add(cube);

            // Управление вращением
            const controls = new OrbitControls(camera, renderer.domElement);
            controls.target.set(0, 0.5, 0);
            controls.enableDamping = true;
            controls.update();

            window.addEventListener('resize', onWindowResize);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);

            // Немного вращаем куб для демонстрации «живой» сцены
            cube.rotation.y += 0.01;

            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
